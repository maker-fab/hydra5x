# HYDRA5X -- plateau basculant sur trois verins
#
# Trois vis verticales sous le plateau donnent Z et le basculement dans
# tout azimut. Configuration Klipper du plateau SEUL : le CoreXY, la tete
# et la thermique restent dans le printer.cfg de la machine hote.
#
# Machine retenue en D24 : plateau 400, appuis a R=150 mm, course
# differentielle 210 mm, course d'une vis 610 mm.
#
#   h_i = z + R.cos(azimut_i).gx + R.sin(azimut_i).gy
#   avec gx = tan(theta).cos(phi), gy = tan(theta).sin(phi)
#
# Les hauteurs sont calculees par le trancheur -- `tools/stitch_chunks.py
# --machine 3points` -- et arrivent ici toutes faites. Klipper n'a pas de
# trigonometrie utilisable en macro, et il n'en a pas besoin : en regime
# INDEXE le plateau bascule a l'arret, entre deux blocs. Il n'y a rien a
# interpoler.
#
# Le jour ou l'on voudra du non-planaire continu, il faudra un vrai noyau
# cinematique en C. La forme lineaire ci-dessus est ce qui le rendra court
# -- meme structure qu'un CoreXY, une combinaison lineaire fixe.
#
# NON VALIDE SUR MACHINE. La geometrie l'est (tools/test_3points.py,
# 6 controles), cette configuration ne l'est pas : elle attend du materiel.

[manual_stepper stepper_z1]
step_pin: PLACEHOLDER
dir_pin: PLACEHOLDER
enable_pin: !PLACEHOLDER
microsteps: 32
rotation_distance: 4              # vis trapezoidale TR8x4
velocity: 15
accel: 100
endstop_pin: PLACEHOLDER

[manual_stepper stepper_z2]
step_pin: PLACEHOLDER
dir_pin: PLACEHOLDER
enable_pin: !PLACEHOLDER
microsteps: 32
rotation_distance: 4
velocity: 15
accel: 100
endstop_pin: PLACEHOLDER

[manual_stepper stepper_z3]
step_pin: PLACEHOLDER
dir_pin: PLACEHOLDER
enable_pin: !PLACEHOLDER
microsteps: 32
rotation_distance: 4
velocity: 15
accel: 100
endstop_pin: PLACEHOLDER


[gcode_macro _PLATEAU]
# Geometrie et butees, en un seul endroit.
variable_rayon:          150.0
variable_z_min:            0.0
variable_z_max:          610.0
variable_course_diff:    210.0
variable_vitesse:         10.0     # mm/s du verin le plus sollicite
gcode:


[gcode_macro BED_POSE]
description: Amene le plateau a une pose donnee par les trois hauteurs
# Les trois verins arrivent ensemble : celui qui parcourt le plus grand
# ecart prend la consigne, les autres sont proportionnels. Un verin deja
# en place n'est pas commande -- une vitesse nulle serait refusee.
gcode:
    {% set p = printer["gcode_macro _PLATEAU"] %}
    {% set z1 = params.Z1|float %}
    {% set z2 = params.Z2|float %}
    {% set z3 = params.Z3|float %}
    {% set hi = [z1, z2, z3]|max %}
    {% set lo = [z1, z2, z3]|min %}

    {% if lo < p.z_min or hi > p.z_max %}
        { action_raise_error("BED_POSE hors butees : %.2f a %.2f mm, "
                             "autorise %.2f a %.2f"
                             % (lo, hi, p.z_min, p.z_max)) }
    {% endif %}
    {% if hi - lo > p.course_diff %}
        { action_raise_error("BED_POSE : %.2f mm d'ecart entre verins, "
                             "course differentielle %.2f mm"
                             % (hi - lo, p.course_diff)) }
    {% endif %}

    {% set c1 = printer["manual_stepper stepper_z1"].position %}
    {% set c2 = printer["manual_stepper stepper_z2"].position %}
    {% set c3 = printer["manual_stepper stepper_z3"].position %}
    {% set d1 = (z1 - c1)|abs %}
    {% set d2 = (z2 - c2)|abs %}
    {% set d3 = (z3 - c3)|abs %}
    {% set pire = [d1, d2, d3]|max %}

    {% if pire > 0.001 %}
        {% if d1 > 0.001 %}
            MANUAL_STEPPER STEPPER=stepper_z1 MOVE={z1} SPEED={p.vitesse * d1 / pire} SYNC=0
        {% endif %}
        {% if d2 > 0.001 %}
            MANUAL_STEPPER STEPPER=stepper_z2 MOVE={z2} SPEED={p.vitesse * d2 / pire} SYNC=0
        {% endif %}
        {% if d3 > 0.001 %}
            MANUAL_STEPPER STEPPER=stepper_z3 MOVE={z3} SPEED={p.vitesse * d3 / pire} SYNC=0
        {% endif %}
        MANUAL_STEPPER STEPPER=stepper_z1 SYNC=1
    {% endif %}


[gcode_macro BED_HOME]
description: Prise d'origine des trois verins, un par un
# Un par un et non ensemble : trois verins qui descendent de travers
# forcent sur les appuis. On les ramene d'abord a plat, lentement.
gcode:
    {% for v in ["stepper_z1", "stepper_z2", "stepper_z3"] %}
        MANUAL_STEPPER STEPPER={v} ENABLE=1 SET_POSITION=0
        MANUAL_STEPPER STEPPER={v} MOVE=-700 SPEED=5 STOP_ON_ENDSTOP=1
        MANUAL_STEPPER STEPPER={v} SET_POSITION=0
        MANUAL_STEPPER STEPPER={v} MOVE=5 SPEED=5
        MANUAL_STEPPER STEPPER={v} MOVE=-10 SPEED=1 STOP_ON_ENDSTOP=1
        MANUAL_STEPPER STEPPER={v} SET_POSITION=0
    {% endfor %}


[gcode_macro BED_FLAT]
description: Ramene le plateau a l'horizontale a une hauteur donnee
gcode:
    {% set z = params.Z|default(200)|float %}
    BED_POSE Z1={z} Z2={z} Z3={z}
