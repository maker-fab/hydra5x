<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <title>HYDRA5X — variante F, le X qui tourne</title>
  <!-- Le X de 5X, dont une branche est un axe droit et l'autre un arc :
       le lineaire et le rotatif dans un seul signe. Le vide central est
       la buse. Abstrait, tient en 16 px, ne ressemble a rien d'autre. -->
  <defs>
    <style>
      .k { fill: none; stroke: #c8823c; stroke-width: 26; stroke-linecap: round; }
      .a { fill: none; stroke: #f08228; stroke-width: 26; stroke-linecap: round; }
    </style>
  </defs>

  <!-- branche lineaire : les axes X Y Z -->
  <path class="k" d="M64 64 L256 256"/>

  <!-- branche rotative : les axes A B, en arc -->
  <path class="a" d="M256 64 C170 104 150 190 64 256"/>

  <!-- la buse au croisement, en negatif -->
  <circle cx="160" cy="160" r="30" fill="#ffffff"/>
  <circle cx="160" cy="160" r="9"  fill="#c8823c"/>
</svg>
